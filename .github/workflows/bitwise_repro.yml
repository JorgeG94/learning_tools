# Bitwise-reproducibility gate for ci_enabled/bitwise_adventures.
#
# Every leg builds the crossbit dump program with a different compiler (and on
# ARM as well as x86_64), runs it on deterministic inputs, and checks the
# sha256 of the raw result bits against the committed golden hash.  The library
# is built only from IEEE-required correctly-rounded operations with a strict
# no-FMA-contraction / no-FTZ flag contract, so ANY conforming toolchain must
# reproduce the golden bits exactly -- one differing bit fails the job.
#
# The GPU leg (nvfortran -stdpar, do concurrent) cannot run on hosted runners;
# it is exercised on Gadi with `make gpubit`.
name: bitwise-repro

on:
  push:
    paths:
      - 'ci_enabled/bitwise_adventures/**'
      - '.github/workflows/bitwise_repro.yml'
  pull_request:
    paths:
      - 'ci_enabled/bitwise_adventures/**'
      - '.github/workflows/bitwise_repro.yml'
  workflow_dispatch:

jobs:
  crossbit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-13 / x86_64
            os: ubuntu-latest
            toolchain: {compiler: gcc, version: '13'}
            flags: -O2 -ffp-contract=off
          - name: gcc-14 / x86_64
            os: ubuntu-latest
            toolchain: {compiler: gcc, version: '14'}
            flags: -O2 -ffp-contract=off
          - name: gcc / macOS arm64
            os: macos-latest
            toolchain: {compiler: gcc, version: '14'}
            flags: -O2 -ffp-contract=off
          - name: intel ifx / x86_64
            os: ubuntu-latest
            toolchain: {compiler: intel, version: '2025.0'}
            flags: -O2 -fp-model=precise -no-fma -no-ftz
          - name: nvidia nvfortran / x86_64
            os: ubuntu-latest
            toolchain: {compiler: nvidia-hpc, version: '25.5'}
            flags: -O2 -Mnofma -Mnoflushz -Mnodaz
          - name: gcc-13 / linux arm64
            os: ubuntu-24.04-arm
            toolchain: {compiler: gcc, version: '13'}
            flags: -O2 -ffp-contract=off
          - name: gcc / windows
            os: windows-latest
            toolchain: {compiler: gcc, version: '13'}
            flags: -O2 -ffp-contract=off
          - name: intel-classic ifort / x86_64
            os: ubuntu-latest
            toolchain: {compiler: intel-classic, version: '2021.10'}
            flags: -O2 -fp-model precise -no-fma -no-ftz
          # --- experimental tier: allowed to fail, each failure is a finding ---
          - name: ifx / windows (experimental)
            os: windows-latest
            toolchain: {compiler: intel, version: '2025.0'}
            # native /Q spellings -- ifx on Windows did NOT honor the dash-style
            # forms (fast-math symptoms: FTZ + fused ulp drift); the env vars
            # below stop git-bash from path-mangling the slashes
            flags: /O2 /fp:precise /Qfma- /Qftz-
            experimental: true
          - name: aocc flang-classic (experimental)
            os: ubuntu-latest
            toolchain: {compiler: aocc, version: '5.1.0'}
            flags: -O2 -ffp-contract=off
            experimental: true
          - name: lfortran (experimental)
            os: ubuntu-latest
            toolchain: {compiler: lfortran, version: '0.45.0'}
            flags: ''
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: '1'
      MSYS2_ARG_CONV_EXCL: '*'
    steps:
      - uses: actions/checkout@v4

      - name: MSVC link environment (windows intel only)
        if: runner.os == 'Windows' && matrix.toolchain.compiler == 'intel'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Build crossbit
        working-directory: ci_enabled/bitwise_adventures
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          $FC ${{ matrix.flags }} src/bit_repro.f90 src/bit_repro_helpers.f90 \
            test/crossbit.f90 -o crossbit_ci

      - name: Fingerprint (mechanism canaries; compare with REFERENCE_FINGERPRINT.txt)
        working-directory: ci_enabled/bitwise_adventures
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          $FC ${{ matrix.flags }} src/bit_repro.f90 src/bit_repro_helpers.f90             test/fingerprint.f90 -o fingerprint_ci
          ./fingerprint_ci
          echo "--- reference (golden-passing legs print exactly this):"
          cat REFERENCE_FINGERPRINT.txt

      - name: Run and verify against the golden bits
        working-directory: ci_enabled/bitwise_adventures
        run: |
          ./crossbit_ci ci
          echo "--- reference per-set/function cells (from a golden-passing leg):"
          cat REFERENCE_CELLS.txt
          echo "--- file-byte forensics (compare with REFERENCE_SETHASHES.txt):"
          python3 -c "import hashlib;d=open('crossbit_ci.bin','rb').read();print('size',len(d));n=200000;blk=5*n*8;[print('set%d'%(k+1),hashlib.sha256(d[k*blk:(k+1)*blk]).hexdigest()[:16]) for k in range(6)]"
          cat REFERENCE_SETHASHES.txt
          got=$(python3 -c "import hashlib;print(hashlib.sha256(open('crossbit_ci.bin','rb').read()).hexdigest())")
          want=$(cut -d' ' -f1 GOLDEN.sha256)
          echo "golden: $want"
          echo "got:    $got"
          test "$got" = "$want" && echo "BITWISE: all values identical to golden" \
            || { echo "::error::bitwise reproducibility broken"; exit 1; }

      - name: Upload dump on failure (for byte-level diffing)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crossbit-dump-job${{ strategy.job-index }}
          path: ci_enabled/bitwise_adventures/crossbit_ci.bin

  # Complementary stage: runs only after every bitwise leg is green.  Bitwise
  # proves all platforms agree; this proves what they agree ON is accurate --
  # max-ulp budgets vs a real128 oracle, enforced by the harness exit code
  # (real128 restricts this stage to gcc/ifx on linux x86).
  accuracy:
    name: accuracy / ${{ matrix.toolchain.compiler }}
    needs: crossbit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: {compiler: gcc, version: '13'}
            flags: -O2 -ffp-contract=off
          - toolchain: {compiler: intel, version: '2025.0'}
            flags: -O2 -fp-model=precise -no-fma -no-ftz
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Build and run the accuracy contract
        working-directory: ci_enabled/bitwise_adventures
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          $FC ${{ matrix.flags }} src/bit_repro.f90 src/bit_repro_helpers.f90 \
            test/harness.f90 -o harness_ci
          ./harness_ci
